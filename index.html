<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMD Motion | Current Inventory</title>
  <meta name="description" content="DMD Motion LLC — Performance cars, trucks, and 4x4s in Bertram, TX. Browse our current inventory.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #F3F0EB;
      --surface: #FFFFFF;
      --border: #DDD8CF;
      --text: #1C1917;
      --text-secondary: #78716C;
      --accent: #9E6B3A;
      --accent-bg: rgba(158, 107, 58, 0.07);
      --tag-avail: #2D6A30;
      --tag-avail-bg: #E4F2E5;
      --tag-sold: #B42318;
      --tag-sold-bg: #FDECEA;
      --img-bg: #E6E2DB;
      --img-icon: #BFB9AF;
      --shadow: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 6px 16px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101318;
        --surface: #1A1E25;
        --border: #2C313A;
        --text: #E3E0DB;
        --text-secondary: #8A857C;
        --accent: #C8956C;
        --accent-bg: rgba(200, 149, 108, 0.1);
        --tag-avail: #5DBB63;
        --tag-avail-bg: rgba(93, 187, 99, 0.12);
        --tag-sold: #EF5350;
        --tag-sold-bg: rgba(239, 83, 80, 0.12);
        --img-bg: #161A20;
        --img-icon: #353940;
        --shadow: 0 1px 3px rgba(0,0,0,0.25);
        --shadow-hover: 0 6px 16px rgba(0,0,0,0.35);
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      padding: 0 16px;
      min-height: 100vh;
    }
    .page { max-width: 1200px; margin: 0 auto; }
    .header { padding: 2.5rem 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1.25rem; }
    .brand { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 700; font-size: 2rem; letter-spacing: 0.05em; color: var(--accent); line-height: 1; }
    .pipe { color: var(--border); font-weight: 300; font-size: 1.5rem; line-height: 1; }
    .tagline { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 500; font-size: 1rem; letter-spacing: 0.12em; color: var(--text-secondary); text-transform: uppercase; }
    .location { width: 100%; font-size: 0.8125rem; color: var(--text-secondary); margin-top: 0.25rem; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 1.25rem 0; margin-top: 0.75rem; border-bottom: 1px solid var(--border); }
    .filter-group { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px; }
    .filter-btn { font-family: 'Barlow', system-ui, sans-serif; font-weight: 500; font-size: 0.8125rem; padding: 0.375rem 0.875rem; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 4px; transition: background 0.15s, color 0.15s; }
    .filter-btn:hover { color: var(--text); }
    .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .filter-btn.active { background: var(--accent); color: #fff; }
    .search-input { font-family: 'Barlow', system-ui, sans-serif; font-size: 0.8125rem; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); flex: 1; min-width: 140px; max-width: 260px; }
    .search-input::placeholder { color: var(--text-secondary); }
    .search-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .sort-select { font-family: 'Barlow', system-ui, sans-serif; font-size: 0.8125rem; font-weight: 500; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }
    .sort-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .vehicle-count { width: 100%; font-size: 0.8125rem; color: var(--text-secondary); padding-top: 0.25rem; }
    .vehicle-count strong { color: var(--text); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; padding: 1.5rem 0 3rem; }
    @media (max-width: 920px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; gap: 1rem; } .brand { font-size: 1.5rem; } .header { padding-top: 1.5rem; } .search-input { max-width: none; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); transition: box-shadow 0.2s ease, transform 0.2s ease; display: flex; flex-direction: column; }
    .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .card.sold-card { opacity: 0.65; }
    .card.sold-card:hover { opacity: 0.8; }
    .card-img { width: 100%; aspect-ratio: 16 / 10; max-width: 100%; background: var(--img-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-img .no-photo { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; color: var(--img-icon); }
    .no-photo svg { width: 36px; height: 36px; }
    .no-photo span { font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; z-index: 1; }
    .card-img:hover .carousel-btn, .card-img .carousel-btn.show { opacity: 1; }
    @media (pointer: coarse) { .carousel-btn { opacity: 0.7; } }
    .carousel-btn:focus-visible { opacity: 1; outline: 2px solid var(--accent); }
    .carousel-prev { left: 6px; }
    .carousel-next { right: 6px; }
    .carousel-dots { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 1; }
    .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); border: none; padding: 0; cursor: pointer; }
    .carousel-dot.active { background: #fff; }
    .card-body { padding: 1rem 1.125rem 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .card-row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .car-name { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 1.0625rem; line-height: 1.25; }
    .car-trim { font-weight: 400; color: var(--text-secondary); }
    .tag { font-family: 'Barlow', system-ui, sans-serif; font-weight: 600; font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 3px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
    .tag-available { background: var(--tag-avail-bg); color: var(--tag-avail); }
    .tag-sold { background: var(--tag-sold-bg); color: var(--tag-sold); }
    .car-price { font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 700; font-size: 1.375rem; color: var(--accent); margin-top: 0.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
    .car-price s { opacity: 0.5; }
    .specs { display: flex; flex-wrap: wrap; gap: 0.375rem 1rem; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.8125rem; }
    .spec-label { color: var(--text-secondary); }
    .spec-value { font-weight: 500; }
    .car-desc { font-size: 0.8125rem; line-height: 1.5; color: var(--text-secondary); margin-top: 0.625rem; }
    .inquire-btn { display: block; width: 100%; margin-top: auto; padding: calc(0.625rem + 0.5rem) 0.5rem 0.625rem; font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .inquire-btn:hover { background: var(--accent); color: #fff; }
    .inquire-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .msg { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">DMD MOTION</div>
      <span class="pipe">|</span>
      <div class="tagline">Performance Cars &amp; Trucks</div>
      <div class="location">Bertram, TX &mdash; 35 min from NW Austin &mdash; (512) 240-2240</div>
    </header>
    <div class="toolbar">
      <div class="filter-group" role="radiogroup" aria-label="Filter vehicles">
        <button class="filter-btn active" data-filter="all" role="radio" aria-checked="true">All</button>
        <button class="filter-btn" data-filter="available" role="radio" aria-checked="false">Available</button>
        <button class="filter-btn" data-filter="sold" role="radio" aria-checked="false">Sold</button>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Search make, model, year..." aria-label="Search vehicles">
      <select class="sort-select" id="sortSelect" aria-label="Sort vehicles">
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="year-desc">Year: Newest First</option>
        <option value="year-asc">Year: Oldest First</option>
        <option value="mileage-asc">Mileage: Lowest</option>
      </select>
      <div class="vehicle-count" id="vehicleCount"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" hidden>No vehicles match your search.</div>
  </div>
  <script>
  (function () {
    var SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTaVZAl5el--txoa1imYwwFcXq2b4rdhetwxUyd7_sFfh8cmjOvUj2DYV8jse9HS4z7dA1_DB-RjCav/pub?gid=0&single=true&output=csv';
    var CONTACT_PHONE = '(512) 240-2240';

    var inventory = [];
    var currentFilter = 'all';
    var currentSort = 'price-asc';
    var searchTerm = '';
    var grid = document.getElementById('grid');
    var emptyState = document.getElementById('emptyState');
    var vehicleCount = document.getElementById('vehicleCount');
    var sortSelect = document.getElementById('sortSelect');
    var searchInput = document.getElementById('searchInput');

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatPrice(n) { return '$' + Number(n).toLocaleString('en-US'); }
    function formatMileage(n) { return Number(n).toLocaleString('en-US') + ' mi'; }
    function noPhotoHTML() {
      return '<div class="no-photo"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="30" height="22" rx="3"/><circle cx="18" cy="18" r="5"/><path d="M11 7l1.5-3h11L25 7"/></svg><span>No photo</span></div>';
    }

    function buildCard(car, index) {
      var isSold = (car.status || '').toLowerCase() === 'sold';
      var name = esc([car.year, car.make, car.model].filter(Boolean).join(' '));
      var trim = esc(car.trim || '');
      var images = (car.image || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      var h = '<article class="card' + (isSold ? ' sold-card' : '') + '">';
      h += '<div class="card-img" data-card="' + index + '">';
      if (images.length > 0) {
        h += '<img src="' + esc(images[0]) + '" alt="' + name + '" loading="lazy" data-images=\'' + JSON.stringify(images) + '\' data-idx="0">';
        if (images.length > 1) {
          h += '<button class="carousel-btn carousel-prev" aria-label="Previous photo">&#8249;</button>';
          h += '<button class="carousel-btn carousel-next" aria-label="Next photo">&#8250;</button>';
          h += '<div class="carousel-dots">';
          for (var i = 0; i < images.length; i++) {
            h += '<span class="carousel-dot' + (i === 0 ? ' active' : '') + '" data-dot="' + i + '"></span>';
          }
          h += '</div>';
        }
      } else {
        h += noPhotoHTML();
      }
      h += '</div><div class="card-body"><div class="card-row-top">';
      h += '<div class="car-name">' + name + (trim ? ' <span class="car-trim">' + trim + '</span>' : '') + '</div>';
      h += '<span class="tag ' + (isSold ? 'tag-sold' : 'tag-available') + '">' + (isSold ? 'Sold' : 'Available') + '</span></div>';
      if (car.price) h += '<div class="car-price">' + (isSold ? '<s>' + formatPrice(car.price) + '</s>' : formatPrice(car.price)) + '</div>';
      h += '<div class="specs">';
      if (car.mileage) h += '<div><span class="spec-label">Miles </span><span class="spec-value">' + formatMileage(car.mileage) + '</span></div>';
      if (car.color) h += '<div><span class="spec-label">Color </span><span class="spec-value">' + esc(car.color) + '</span></div>';
      h += '</div>';
      if (car.description) h += '<div class="car-desc">' + esc(car.description) + '</div>';
      if (!isSold && CONTACT_PHONE) h += '<button class="inquire-btn" onclick="this.textContent=\'' + esc(CONTACT_PHONE) + '\'">Call to Inquire</button>';
      h += '</div></article>';
      return h;
    }

    function getVisible() {
      var list = inventory;
      if (currentFilter === 'available') list = list.filter(function (c) { return (c.status || '').toLowerCase() !== 'sold'; });
      else if (currentFilter === 'sold') list = list.filter(function (c) { return (c.status || '').toLowerCase() === 'sold'; });
      if (searchTerm) {
        var q = searchTerm.toLowerCase();
        list = list.filter(function (c) { return [c.year, c.make, c.model, c.trim, c.color, c.description].join(' ').toLowerCase().indexOf(q) !== -1; });
      }
      var sorted = list.slice();
      switch (currentSort) {
        case 'price-asc': sorted.sort(function (a, b) { return (a.price||0)-(b.price||0); }); break;
        case 'price-desc': sorted.sort(function (a, b) { return (b.price||0)-(a.price||0); }); break;
        case 'year-desc': sorted.sort(function (a, b) { return (b.year||0)-(a.year||0); }); break;
        case 'year-asc': sorted.sort(function (a, b) { return (a.year||0)-(b.year||0); }); break;
        case 'mileage-asc': sorted.sort(function (a, b) { return (a.mileage||0)-(b.mileage||0); }); break;
      }
      return sorted;
    }

    function render() {
      var visible = getVisible();
      var availCount = inventory.filter(function (c) { return (c.status || '').toLowerCase() !== 'sold'; }).length;
      vehicleCount.innerHTML = '<strong>' + availCount + '</strong> vehicle' + (availCount !== 1 ? 's' : '') + ' available' +
        (inventory.length > availCount ? ' &middot; ' + (inventory.length - availCount) + ' recently sold' : '');
      if (visible.length === 0) { grid.innerHTML = ''; emptyState.hidden = false; }
      else { emptyState.hidden = true; grid.innerHTML = visible.map(function(car, i) { return buildCard(car, i); }).join(''); }
    }

    function parseRow(row) {
      var keys = {};
      Object.keys(row).forEach(function (k) { keys[k.trim().toLowerCase()] = row[k]; });
      return {
        year: parseInt(keys.year, 10) || '',
        make: (keys.make || '').trim(),
        model: (keys.model || '').trim(),
        trim: (keys.trim || '').trim(),
        price: parseFloat((keys.price || '').toString().replace(/[$,]/g, '')) || 0,
        mileage: parseFloat((keys.mileage || keys.miles || '').toString().replace(/[,]/g, '')) || 0,
        color: (keys.color || keys.colour || '').trim(),
        description: (keys.description || keys.desc || '').trim(),
        image: (keys.image || keys.photo || keys['image url'] || keys['photo url'] || '').trim(),
        status: (keys.status || 'Available').trim(),
      };
    }

    function loadFromSheet() {
      if (!SHEET_URL) {
        grid.innerHTML = '<div class="msg">Connect your Google Sheet to display inventory.<br>Edit <code>SHEET_URL</code> in this file to get started.</div>';
        vehicleCount.innerHTML = '';
        return;
      }
      grid.innerHTML = '<div class="msg">Loading inventory...</div>';
      fetch(SHEET_URL, { mode: 'cors', credentials: 'omit' })
        .then(function (res) { return res.text(); })
        .then(function (csv) {
          var results = Papa.parse(csv, { header: true, skipEmptyLines: true });
          if (results.data && results.data.length) {
            inventory = results.data.map(parseRow).filter(function (c) { return c.make; });
          }
          render();
        })
        .catch(function () {
          grid.innerHTML = '<div class="msg" style="color:var(--tag-sold)">Could not load inventory. Check that your Google Sheet is published to the web.</div>';
        });
    }

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-checked', 'false'); });
        btn.classList.add('active'); btn.setAttribute('aria-checked', 'true');
        currentFilter = btn.getAttribute('data-filter');
        render();
      });
    });
    sortSelect.addEventListener('change', function () { currentSort = sortSelect.value; render(); });
    var searchTimer;
    searchInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { searchTerm = searchInput.value.trim(); render(); }, 200);
    });
    document.addEventListener('error', function (e) {
      if (e.target.tagName === 'IMG' && e.target.closest('.card-img')) e.target.parentNode.innerHTML = noPhotoHTML();
    }, true);

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.carousel-prev, .carousel-next');
      if (!btn) return;
      var container = btn.closest('.card-img');
      var img = container.querySelector('img');
      if (!img) return;
      var images = JSON.parse(img.getAttribute('data-images'));
      var idx = parseInt(img.getAttribute('data-idx'), 10);
      if (btn.classList.contains('carousel-prev')) idx = (idx - 1 + images.length) % images.length;
      else idx = (idx + 1) % images.length;
      img.setAttribute('data-idx', idx);
      img.src = images[idx];
      var dots = container.querySelectorAll('.carousel-dot');
      dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
    });

    var touchStartX = 0;
    document.addEventListener('touchstart', function (e) {
      if (e.target.closest('.card-img')) touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      var container = e.target.closest('.card-img');
      if (!container) return;
      var img = container.querySelector('img');
      if (!img || !img.getAttribute('data-images')) return;
      var diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) < 40) return;
      var images = JSON.parse(img.getAttribute('data-images'));
      if (images.length < 2) return;
      var idx = parseInt(img.getAttribute('data-idx'), 10);
      idx = diff < 0 ? (idx + 1) % images.length : (idx - 1 + images.length) % images.length;
      img.setAttribute('data-idx', idx);
      img.src = images[idx];
      var dots = container.querySelectorAll('.carousel-dot');
      dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
    });

    loadFromSheet();
  })();
  </script>
</body>
</html>
